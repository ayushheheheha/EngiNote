# EngiNote Native: the truly native iPad app (SwiftUI, PencilKit, PDFKit). No web view.
# Built on a cloud Mac by .github/workflows/native.yml. Installs beside the web-based EngiNote
# (a different bundle id), so the old app stays on the iPad as a fallback.

name: EngiNoteNative

options:
  deploymentTarget:
    iOS: "17.5"

targets:
  EngiNoteNative:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: App
      # the web-based app's own recorder, camera bubble, browser, video editor and Studio: the same files, not copies
      - path: ../ios/App
        includes:
          - Recorder.swift
          - CameraBubble.swift
          - BrowserPane.swift
          - VideoEditor.swift
          - "Studio*.swift"
          - "studio-*.mp4"
      # run as plain scripts (no web view): the calculator's sums, and the promo cover's page
      - path: ../calc.js
        buildPhase: resources
      - path: ../cover.js
        buildPhase: resources
      - path: ../cover-fonts.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.engikode.enginote.native
        PRODUCT_NAME: EngiNoteNative
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "2,1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: EngiNote Native
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true # iPad windows side by side
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: EngiNote records your voice with the screen when you make a recording.
        NSPhotoLibraryAddUsageDescription: EngiNote saves a recording to Photos when you choose to.
        NSCameraUsageDescription: EngiNote shows you in a camera bubble over your note when you switch it on.
        UIFileSharingEnabled: true # the notebooks are visible in the Files app
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: Web page
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.html]
          - CFBundleTypeName: EngiNote backup
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.json]
