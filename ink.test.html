<!doctype html>
<meta charset="utf-8">
<title>ink.js checks</title>
<!-- Open through the app's http server: browsers refuse module imports from file:// -->
<body style="font: 14px/1.6 monospace; margin: 0; padding: 0">
<svg id="s" viewBox="0 0 400 300" style="display:block; width:800px; height:600px; background:#f4f4f4"></svg>
<div id="out" style="padding: 8px"></div>
<script type="module">
import { createInk, pathData, boxOf, hitStroke, distToSegment, opacityOf } from './ink.js';
import { createLasso, inLoop, pick, reshape } from './lasso.js';
import { recognise, aim } from './shapes.js';
import { rearrange } from './pages.js';

const out = document.getElementById('out');
let passed = 0, failed = 0;
function line(text, ok) {
  const div = document.createElement('div');
  div.textContent = text;
  div.style.color = ok ? 'green' : 'crimson';
  out.appendChild(div);
}
function check(name, ok) {
  console.assert(ok, name);
  ok ? passed++ : failed++;
  line(`${ok ? 'PASS' : 'FAIL'}  ${name}`, ok);
}

try {
  // --- pages: reordering, doubling and dropping carry the ink with them ---
  {
    const doc = { pages: [{ h: 100 }, { h: 100 }, { h: 100 }] };
    const a = { tool: 'pen', color: 'a', size: 1, points: [[0, 10]] }, b = { ...a, color: 'b', points: [[0, 110]] }, c = { ...a, color: 'c', points: [[0, 210]] };
    const y = r => r.strokes.map(s => s.color + s.points[0][1]).join(' ');
    check('rearrange: a page moved takes its ink along', y(rearrange(doc, [a, b, c], [], [2, 0, 1])) === 'c10 a110 b210');
    check('rearrange: a page left out takes its ink away and the rest close up', y(rearrange(doc, [a, b, c], [], [0, 2])) === 'a10 c110');
    check('rearrange: a page doubled is inked twice, the first copy the very stroke', (r => y(r) === 'a10 b110 b210 c310' && r.strokes[0] === a && r.pages.length === 4)(rearrange(doc, [a, b, c], [], [0, 1, 1, 2])));
    check('rearrange: items go with their page too', rearrange(doc, [], [{ y: 150, h: 10 }], [1, 1]).items.map(i => i.y).join() === '50,150');
  }

  // --- geometry ---
  const clean = d => !/NaN|undefined|null/.test(d);
  const d1 = pathData([[10, 20]]);
  const d2 = pathData([[10, 20], [30, 40]]);
  const d5 = pathData([[0, 0], [10, 5], [20, 0], [30.5, 5], [40, 0]]);
  check('pathData: no points gives an empty string', pathData([]) === '');
  check('pathData: 1 point is a dot at that point', d1.startsWith('M10 20') && d1.length > 'M10 20'.length && clean(d1));
  check('pathData: 2 points is a straight line', d2 === 'M10 20L30 40');
  check('pathData: 5 points gives 3 curves ending on the last point',
    d5.startsWith('M0 0Q') && d5.split('Q').length - 1 === 3 && d5.endsWith('L40 0') && clean(d5));

  // The browser's own path parser is the real judge of "well-formed".
  const probe = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  const len = d => (probe.setAttribute('d', d), probe.getTotalLength());
  check('pathData: browser parses all three', len(d1) > 0 && Math.abs(len(d2) - Math.hypot(20, 20)) < 0.01 && len(d5) > 40);

  const long = { tool: 'pen', color: '#000', size: 2, points: [[0, 0], [1000, 0]] };
  check('distToSegment: perpendicular and past-the-end distances',
    distToSegment(5, 3, 0, 0, 10, 0) === 3 && distToSegment(13, 4, 0, 0, 10, 0) === 5);
  check('hitStroke: hits near the middle of a long 2-point segment', hitStroke(long, 500, 3, 5));
  check('hitStroke: misses a far point', !hitStroke(long, 500, 50, 5));
  check('hitStroke: radius accounts for stroke width',
    hitStroke({ ...long, tool: 'highlighter', size: 10 }, 500, 28, 5) && !hitStroke(long, 500, 28, 5));
  // The eraser skips any stroke whose box it does not reach, so the box must cover all of the ink.
  check('boxOf: covers the points plus half the stroke width',
    String(boxOf(long)) === '-1,-1,1001,1' && String(boxOf({ ...long, tool: 'highlighter', size: 10 })) === '-25,-25,1025,25');
  const pressed = { tool: 'pen', color: '#000', size: 4, points: [[10, 10, 1], [30, 20, 0.2]] };
  check('boxOf: a flow stroke is boxed with room for its widest (its whole size either side)',
    boxOf(pressed)[0] === 10 - 4 && boxOf(pressed)[3] === 20 + 4 && boxOf({ ...pressed, tool: 'flow', points: [[10, 10], [30, 20]] })[2] === 34);
  check('opacityOf: a stroke\'s own, else the old highlighter\'s, else solid',
    opacityOf({ tool: 'pen', opacity: 0.5 }) === 0.5 && opacityOf({ tool: 'highlighter' }) === 0.35 &&
    opacityOf({ tool: 'highlighter', opacity: 1 }) === 1 && opacityOf({ tool: 'glow' }) === 1);

  // --- engine, on a real <svg> ---
  const svg = document.getElementById('s');
  let changes = 0, zoomed = 1, doubleTaps = 0, erases = 0, held = null, zoomEnds = 0;
  const strokeEls = () => [...svg.querySelector('g').children];   // one element per stroke, in the strokes' group
  const ink = createInk(svg, {
    scroller: document.scrollingElement,
    onChange: () => changes++,
    onZoom: (factor, x, y, hold) => { zoomed *= factor; held = hold; },
    onZoomEnd: () => zoomEnds++,
    onDoubleTap: () => doubleTaps++,
    onErase: () => erases++,
  });
  const saved = [
    { tool: 'pen', color: '#c00', size: 3, points: [[10, 10], [50, 60.5], [90, 10]] },
    { tool: 'highlighter', color: 'yellow', size: 4, points: [[20, 100], [200, 100]] },
  ];
  const same = () => JSON.stringify(ink.getStrokes()) === JSON.stringify(saved);

  ink.load(undefined);
  check('load(undefined) is tolerated', ink.getStrokes().length === 0);
  ink.load(saved);
  check('load -> getStrokes round-trips', same());
  check('load renders one <path> per stroke', svg.querySelectorAll('path').length === 2);
  check('load does not call onChange', changes === 0);
  check('load resets history', !ink.canUndo() && !ink.canRedo());

  ink.clear();
  check('clear removes strokes and paths', ink.getStrokes().length === 0 && svg.querySelectorAll('path').length === 0);
  check('clear calls onChange once', changes === 1);
  check('after clear: canUndo, not canRedo', ink.canUndo() && !ink.canRedo());
  ink.clear();
  check('clear when already empty is a no-op', changes === 1);

  ink.undo();
  check('undo restores the cleared strokes', same() && svg.querySelectorAll('path').length === 2);
  check('after undo: canRedo, not canUndo', !ink.canUndo() && ink.canRedo());
  ink.redo();
  check('redo clears again; flags flip back', ink.getStrokes().length === 0 && ink.canUndo() && !ink.canRedo());

  // --- pointer input (synthetic events; svg is 2x the viewBox, so screen px / 2 = page px) ---
  const box = svg.getBoundingClientRect();
  // `t` fakes the event time, so the palm-rejection time windows can be tested without waiting.
  const fire = (type, x, y, pointerType = 'mouse', pointerId = 7, { t, ...init } = {}) => {
    const ev = new PointerEvent(type, {
      pointerId, pointerType, button: 0, buttons: 1, bubbles: true, cancelable: true,
      clientX: box.left + x * 2, clientY: box.top + y * 2, ...init,
    });
    if (t !== undefined) Object.defineProperty(ev, 'timeStamp', { value: t });
    svg.dispatchEvent(ev);
  };
  const drag = (x0, y0, x1, y1, pointerType) => {
    fire('pointerdown', x0, y0, pointerType);
    fire('pointermove', x1, y1, pointerType);
    fire('pointerup', x1, y1, pointerType);
  };

  ink.load([]);
  changes = 0;
  drag(50, 50, 150, 50);
  const drawn = ink.getStrokes();
  check('mouse drag draws one stroke in viewBox units',
    drawn.length === 1 && changes === 1 && drawn[0].points.length === 2 &&
    String(drawn[0].points[0]) === '50,50' && String(drawn[0].points[1]) === '150,50');

  // --- touch and stylus ---
  drag(50, 80, 150, 80, 'touch');
  check('by default a finger does not draw (it scrolls)', ink.getStrokes().length === 1 && changes === 1);
  ink.setFingerDraw(true);
  drag(50, 80, 150, 80, 'touch');
  check('a finger draws once finger drawing is switched on', ink.getStrokes().length === 2 && changes === 2);
  ink.undo();

  fire('pointerdown', 50, 90, 'touch', 1);
  fire('pointermove', 150, 90, 'touch', 1);
  fire('pointercancel', 150, 90, 'touch', 1);
  check('a finger stroke the system cancels (its own palm rejection) is dropped',
    ink.getStrokes().length === 1 && svg.querySelectorAll('path').length === 1);

  fire('pointerdown', 100, 100, 'touch', 1);
  fire('pointermove', 110, 100, 'touch', 1);
  fire('pointerdown', 200, 100, 'touch', 2);   // fingers now 90 apart...
  fire('pointermove', 290, 100, 'touch', 2);   // ...then 180 apart
  fire('pointerup', 290, 100, 'touch', 2);
  fire('pointerup', 110, 100, 'touch', 1);
  check('two fingers pinch-zoom and leave no stroke', ink.getStrokes().length === 1 && Math.abs(zoomed - 2) < 0.01);
  // The fingers were at x = 110 and 200 when the second landed, so the page point they hold is midway.
  check('a pinch names the page point it took hold of, for the app to keep under the fingers', String(held) === '155,100');
  // The app only settles the real zoom when the gesture is over, so it must be told, exactly once.
  check('the end of a pinch is reported once, when the first finger lifts', zoomEnds === 1);

  fire('pointerdown', 50, 120, 'touch', 1);    // palm lands first and starts a stroke
  fire('pointermove', 90, 120, 'touch', 1);
  fire('pointerdown', 50, 140, 'pen', 2);
  fire('pointermove', 150, 140, 'pen', 2);
  fire('pointerup', 150, 140, 'pen', 2);
  fire('pointerup', 90, 120, 'touch', 1);
  const afterPen = ink.getStrokes();
  check('a stylus draws, and the palm stroke under way when it lands is dropped',
    afterPen.length === 2 && afterPen[1].points[0][1] === 140);
  ink.setFingerDraw(false);
  drag(50, 160, 150, 160, 'touch');
  check('with finger drawing switched off again, a finger no longer draws', ink.getStrokes().length === 2);
  ink.undo();

  // --- the pens: pen (even line), glow (even line with a halo), crayon (follows pressure) ---
  const penStroke = (y, t) => {
    fire('pointerdown', 50, y, 'pen', 2, { t, pressure: 0.2 });
    fire('pointermove', 150, y, 'pen', 2, { t: t + 16, pressure: 0.9 });
    fire('pointerup', 150, y, 'pen', 2, { t: t + 32, buttons: 0 });
  };
  penStroke(180, 9000);
  const even = ink.getStrokes()[1], evenEl = strokeEls()[1];
  check('the pen draws an even line, whatever pressure the stylus reports',
    even.tool === 'pen' && even.points.every(p => p.length === 2) &&
    evenEl.tagName === 'path' && evenEl.getAttribute('fill') === 'none' && evenEl.getAttribute('stroke-width') === '3');
  ink.undo();

  ink.setTool('glow');
  penStroke(180, 9200);
  const glow = ink.getStrokes()[1], glowEl = strokeEls()[1];
  const widths = [...glowEl.children].map(p => +p.getAttribute('stroke-width'));
  check('the glow pen stores a glow stroke with plain points', glow.tool === 'glow' && glow.points.every(p => p.length === 2));
  check('a glow stroke is drawn as a halo under the line: wider and fainter layers sharing one path',
    glowEl.tagName === 'g' && widths.length === 5 && widths[0] > widths[1] && widths[1] > widths[2] && widths[2] > widths[3] &&
    widths[3] === 3 && widths[4] < 3 && +glowEl.children[0].getAttribute('stroke-opacity') < +glowEl.children[2].getAttribute('stroke-opacity') &&
    new Set([...glowEl.children].map(p => p.getAttribute('d'))).size === 1 && glowEl.children[0].getAttribute('d') === 'M50 180L150 180');
  ink.undo();
  check('undoing a glow stroke takes its whole group away', strokeEls().length === 1 && svg.querySelectorAll('path').length === 1);
  ink.redo();
  check('redo puts the same group back', strokeEls()[1] === glowEl);
  ink.load(ink.getStrokes());
  check('a glow stroke survives save and load', ink.getStrokes()[1].tool === 'glow' && strokeEls()[1].tagName === 'g');
  ink.load(ink.getStrokes().slice(0, 1));

  // --- smoothing: a slow diagonal reported in whole screen pixels arrives as stairs, half a pixel either side of the line ---
  ink.setTool('pen');
  const slope = x => 180 + Math.round((x - 50) * 2 * 0.3) / 2;   // 1 viewBox unit is 2 screen px here, so y lands on whole screen pixels
  fire('pointerdown', 50, 180, 'pen', 2, { t: 9100, pressure: 0.5 });
  for (let x = 50.5; x <= 150; x += 0.5) fire('pointermove', x, slope(x), 'pen', 2, { t: 9100 + x, pressure: 0.5 });
  fire('pointerup', 150, slope(150), 'pen', 2, { t: 9300, buttons: 0 });
  const stairs = ink.getStrokes()[1].points;
  // How far each stored point lies from the true line, in screen px (the last point is the tip itself, stairs and all).
  const off = Math.max(...stairs.slice(0, -1).map(([x, y]) => Math.abs(y - (180 + (x - 50) * 0.3)) * 2 * Math.cos(Math.atan(0.3))));
  check('stair-stepped input is smoothed: the stored points keep well inside the half pixel the stairs stray by', off < 0.3 && stairs.length > 20);
  check('...they are a couple of screen pixels apart, not one per report', stairs.length < 110);
  check('...and the line still ends exactly where the tip left the page', stairs.at(-1)[0] === 150 && stairs.at(-1)[1] === slope(150));
  ink.load(ink.getStrokes().slice(0, 1));

  // --- opacity: a pen's own, on the stroke and on its element ---
  ink.setOpacity(0.5);
  penStroke(180, 9400);
  check('a see-through pen: the stroke carries its opacity, and so does its element',
    ink.getStrokes()[1].opacity === 0.5 && strokeEls()[1].getAttribute('opacity') === '0.5');
  ink.load(ink.getStrokes());
  check('...and it survives save and load', ink.getStrokes()[1].opacity === 0.5 && strokeEls()[1].getAttribute('opacity') === '0.5');
  ink.undo();
  ink.setOpacity(1);
  ink.load([...ink.getStrokes().slice(0, 1), { tool: 'highlighter', color: '#ff0', size: 4, points: [[50, 180], [150, 180]] }]);
  check('a highlighter stroke saved before pens had an opacity is still drawn at 35%',
    ink.getStrokes()[1].opacity === undefined && strokeEls()[1].getAttribute('opacity') === '0.35');
  ink.setTool('highlighter');
  penStroke(190, 9600);
  check('a new highlighter stroke always says how see-through it is, even at 100%',
    ink.getStrokes()[2].opacity === 1 && !strokeEls()[2].hasAttribute('opacity') && strokeEls()[2].getAttribute('stroke-width') === '15');
  ink.load(ink.getStrokes().slice(0, 1));
  ink.setTool('flow');

  // --- the flow pen (shaped by perfect-freehand), hover, palm rejection (faked event times, all later than the real ones above) ---
  // A stylus line along y = 200, a point every 2px: light for the first half, heavy for the second.
  fire('pointerdown', 50, 200, 'pen', 2, { t: 10000, pressure: 0.15 });
  for (let i = 1; i <= 50; i++) fire('pointermove', 50 + i * 2, 200, 'pen', 2, { t: 10000 + i * 8, pressure: i < 25 ? 0.15 : 0.9 });
  fire('pointerup', 150, 200, 'pen', 2, { t: 10500, buttons: 0 });
  const heavy = ink.getStrokes()[1];
  const heavyPath = strokeEls()[1];
  const inked = (x, y) => heavyPath.isPointInFill(new DOMPoint(x, y));
  // How far the ink reaches above and below the line at x, in viewBox units.
  const thick = x => { let n = 0; for (let y = 195; y <= 205; y += 0.1) if (inked(x, y)) n++; return n / 10; };
  check('the flow pen stores a flow stroke with the stylus pressure on every point',
    heavy.tool === 'flow' && heavy.points.length > 40 && heavy.points.every(p => p.length === 3) && heavy.points.at(-1)[2] > heavy.points[0][2]);
  check('it is drawn as one filled, closed outline',
    heavyPath.tagName === 'path' && heavyPath.getAttribute('fill') === heavy.color && !heavyPath.getAttribute('stroke') &&
    (heavyPath.getAttribute('d').match(/M/g) || []).length === 1 && heavyPath.getAttribute('d').endsWith('Z'));
  check('solid from end to end, and nowhere else', [52, 75, 100, 125, 148].every(x => inked(x, 200)) && !inked(125, 210) && !inked(40, 200) && !inked(160, 200));
  check('thin where the stylus was light, thick where it pressed: around its size (3) in between',
    thick(65) > 0.5 && thick(65) < 3 && thick(135) > 3 && thick(135) < 6);

  ink.load(ink.getStrokes());
  check('a flow stroke survives save and load unchanged',
    JSON.stringify(ink.getStrokes()[1]) === JSON.stringify(heavy) && strokeEls()[1].getAttribute('d') === heavyPath.getAttribute('d'));
  // The "crayon" of earlier versions saved its strokes as 'pen' with a pressure on every point.
  ink.load([...ink.getStrokes().slice(0, 1), { ...heavy, tool: 'pen' }]);
  check('an old crayon stroke is still drawn as a filled outline', strokeEls()[1].getAttribute('fill') === heavy.color && !strokeEls()[1].getAttribute('stroke'));
  ink.load(ink.getStrokes().slice(0, 1));

  drag(50, 200, 150, 200);   // a mouse: no pressure to follow
  const plain = ink.getStrokes()[1];
  check('without a pressure reading the flow pen still draws its filled outline, from plain points',
    plain.tool === 'flow' && plain.points.every(p => p.length === 2) && strokeEls()[1].getAttribute('fill') === plain.color &&
    strokeEls()[1].isPointInFill(new DOMPoint(100, 200)));
  ink.load(ink.getStrokes().slice(0, 1));

  // Two fingers `from` apart, one moves until they are `to` apart. Returns the zoom factor that produced.
  const pinch = (t, from = 90, to = 180) => {
    const before = zoomed;
    fire('pointerdown', 100, 250, 'touch', 21, { t });
    fire('pointerdown', 100 + from, 250, 'touch', 22, { t });
    fire('pointermove', 100 + to, 250, 'touch', 22, { t: t + 16 });
    fire('pointerup', 100, 250, 'touch', 21, { t: t + 32 });
    fire('pointerup', 100 + to, 250, 'touch', 22, { t: t + 32 });
    return zoomed / before;
  };
  check('touches that land just after the stylus wrote are taken for the palm', pinch(10300) === 1);

  const nib = (svg.nextElementSibling || svg).querySelector('circle');   // on the live layer beside the svg
  fire('pointermove', 60, 60, 'pen', 2, { t: 11000, buttons: 0 });
  check('a hovering stylus shows a preview of the tip and draws nothing',
    nib.style.display !== 'none' && +nib.getAttribute('cx') === 60 && +nib.getAttribute('cy') === 60 &&
    !nib.nextSibling && ink.getStrokes().length === 1);
  check('a stylus hovering nearby does not stop fingers scrolling and zooming', Math.abs(pinch(11050) - 2) < 0.01);
  check('fingers pan and zoom once the stylus has been off the page a moment', Math.abs(pinch(20000) - 2) < 0.01);
  check('a finger must travel a little before it scrolls or zooms', pinch(30000, 90, 92) === 1);

  fire('pointerdown', 100, 250, 'touch', 21, { t: 40000 });
  fire('pointerdown', 190, 250, 'touch', 22, { t: 40000 });
  fire('pointermove', 280, 250, 'touch', 22, { t: 40016 });
  const midPinch = zoomed, endsBefore = zoomEnds;
  fire('pointerdown', 50, 280, 'pen', 2, { t: 40100, pressure: 0.4 });
  const endsAtPenDown = zoomEnds;
  fire('pointermove', 370, 250, 'touch', 22, { t: 40116 });
  fire('pointermove', 150, 280, 'pen', 2, { t: 40132, pressure: 0.4 });
  const previewWhileDrawing = nib.style.display;
  fire('pointerup', 150, 280, 'pen', 2, { t: 40148, buttons: 0 });
  fire('pointerup', 100, 250, 'touch', 21, { t: 40200 });
  fire('pointerup', 370, 250, 'touch', 22, { t: 40200 });
  check('when the stylus lands, fingers already on the page stop scrolling and zooming',
    zoomed === midPinch && ink.getStrokes().length === 2);
  check('a drawing tool\'s preview is hidden while the stylus is drawing', previewWhileDrawing === 'none');
  check('...and the pinch it cut short is reported as ended, once', endsAtPenDown === endsBefore + 1 && zoomEnds === endsBefore + 1);
  ink.undo();

  // A pinch is the last two fingers to land, whatever else is on the glass, and however far each has gone.
  {
    const was = zoomed, ends = zoomEnds;
    fire('pointerdown', 10, 290, 'touch', 41, { t: 50000 });   // a thumb resting at the edge of the screen
    fire('pointerdown', 100, 250, 'touch', 42, { t: 50100 });
    fire('pointerdown', 190, 250, 'touch', 43, { t: 50100 });
    fire('pointermove', 280, 250, 'touch', 43, { t: 50116 });  // 90 apart, then 180
    fire('pointerup', 280, 250, 'touch', 43, { t: 50200 });
    fire('pointerup', 100, 250, 'touch', 42, { t: 50200 });
    fire('pointerup', 10, 290, 'touch', 41, { t: 50300 });
    check('a thumb resting on the screen does not stop two other fingers pinching', Math.abs(zoomed / was - 2) < 0.01 && zoomEnds === ends + 1);
  }
  {
    const was = zoomed;
    fire('pointerdown', 100, 250, 'touch', 42, { t: 51000 });
    fire('pointerdown', 190, 250, 'touch', 43, { t: 51000 });
    fire('pointermove', 90, 250, 'touch', 42, { t: 51016 });   // one finger goes well past the slop: 90 apart to 100
    fire('pointermove', 195, 250, 'touch', 43, { t: 51032 });  // the other only 5px: 100 apart to 105, which still counts
    fire('pointerup', 195, 250, 'touch', 43, { t: 51100 });
    fire('pointerup', 90, 250, 'touch', 42, { t: 51100 });
    check('a pinch counts the small steps of the finger that has not travelled far', Math.abs(zoomed / was - 105 / 90) < 0.01);
  }
  {
    fire('pointerdown', 100, 250, 'touch', 42, { t: 52000 });
    fire('pointerdown', 190, 250, 'touch', 43, { t: 52000 });
    fire('pointermove', 280, 250, 'touch', 43, { t: 52016 });
    fire('pointerup', 100, 250, 'touch', 42, { t: 52100 });    // one finger lifts, the other stays down
    const was = zoomed, ends = zoomEnds, top = scrollY;
    fire('pointermove', 280, 100, 'touch', 43, { t: 52116 });
    check('the finger left down after a pinch does not scroll or zoom on its own', zoomed === was && scrollY === top);
    fire('pointerdown', 150, 100, 'touch', 44, { t: 52200 });   // ...but a new finger pinches with it again
    fire('pointermove', 40, 100, 'touch', 44, { t: 52216 });    // 130 apart, then 240
    fire('pointerup', 40, 100, 'touch', 44, { t: 52300 });
    fire('pointerup', 280, 100, 'touch', 43, { t: 52300 });
    check('...a new finger pinches with it again, without both being lifted', zoomed / was > 1.5 && zoomEnds === ends + 1);
  }

  // A finger tap: down and up on the same spot `held` ms apart.
  const tap = (t, x = 200, y = 150, held = 80) => {
    fire('pointerdown', x, y, 'touch', 31, { t });
    fire('pointerup', x, y, 'touch', 31, { t: t + held, buttons: 0 });
  };
  tap(50000);
  check('one finger tap is not a double tap', doubleTaps === 0);
  tap(50200);
  check('two quick finger taps on the same spot are a double tap', doubleTaps === 1);
  tap(51000); tap(52000);
  check('taps too far apart in time are not a double tap', doubleTaps === 1);
  tap(53000); tap(53200, 300, 150);
  check('taps too far apart on the page are not a double tap', doubleTaps === 1);
  tap(54000, 200, 150, 400); tap(54500, 200, 150, 400);
  check('long presses are not taps', doubleTaps === 1);
  fire('pointerdown', 50, 280, 'pen', 2, { t: 55000, pressure: 0.4 });
  fire('pointerup', 50, 280, 'pen', 2, { t: 55050, buttons: 0 });
  ink.undo();
  tap(55150); tap(55350);
  check('a double tap still counts right after writing, when touches are otherwise taken for the palm',
    doubleTaps === 2 && ink.getStrokes().length === 1);

  fire('pointerdown', 200, 200);
  fire('pointerup', 200, 200);
  check('a click leaves a one-point stroke', ink.getStrokes().length === 2 && ink.getStrokes()[1].points.length === 1);

  ink.setTool('eraser');
  changes = 0;
  drag(300, 20, 300, 280);
  check('eraser drag that touches nothing changes nothing', ink.getStrokes().length === 2 && changes === 0 && erases === 0);

    'a box with a narrow top': along([150, 80], [250, 80], [320, 200], [80, 200], [150, 80]),
    'a line gone over twice': along([80, 150], [320, 154], [80, 158], [82, 150]),
    'an arrow': along([80, 150], [320, 150], [290, 120], [320, 150], [290, 180]),
    'a dot': [[100, 100], [100.5, 100.2]],
    'a small o, as in handwriting': oval(200, 150, 8, 10),
    'a dash too short to matter': along([100, 100], [112, 101]),
  };
  for (const [name, pts] of Object.entries(none)) {
    check(`recognise: ${name} is no shape, clean or shaky`, kind(pts) === null && kind(shaky(pts, 1.5)) === null);
  }

  // --- stability: how far the ink trails the tip is the pen's own setting ---
  // A line up the same slope as above, drawn at a given stability through the positions `path` gives.
  // Returns the stored points, how far they stray from the true line (screen px), and the positions that were reported.
  const drawnAt = (stability, path) => {
    ink.load([]);
    ink.setStability(stability);
    const seen = new Set([`50,${path(50)}`]);
    fire('pointerdown', 50, path(50), 'pen', 2, { pressure: 0.5 });
    for (let x = 50.5; x <= 150; x += 0.5) { fire('pointermove', x, path(x), 'pen', 2, { pressure: 0.5 }); seen.add(`${x},${path(x)}`); }
    fire('pointerup', 150, path(150), 'pen', 2, { buttons: 0 });
    const points = ink.getStrokes()[0].points;
    // (not its two ends: the stroke begins where the stylus landed and ends where it lifted, whatever the smoothing)
    return { points, seen, stray: Math.max(...points.slice(5, -1).map(([x, y]) => Math.abs(y - (180 + (x - 50) * 0.3)) * 2 * Math.cos(Math.atan(0.3)))) };
  };
  const raw = drawnAt(0, slope), usual = drawnAt(3, slope), steady = drawnAt(10, slope);
  check('stability 0 does not smooth at all: every stored point is a position the stylus reported, stairs and all',
    raw.points.length > 20 && raw.points.every(p => raw.seen.has(String(p))) && raw.stray > 0.35);
  check('stability 3 is the smoothing there has always been', usual.stray < 0.3 && usual.stray < raw.stray * 0.7);
  check('stability 10 smooths the stairs further still', steady.stray < usual.stray * 0.7 && steady.points.length > 20);
  check('...and its line still ends exactly where the tip left the page', String(steady.points.at(-1)) === `150,${slope(150)}`);
  // A trembling hand: the tip 1.5 screen px to one side of the line, then to the other, turn about every 6px.
  const tremble = x => Math.round((180 + (x - 50) * 0.3 + (Math.floor(x / 3) % 2 ? 0.75 : -0.75)) * 100) / 100;
  const shakes = [0, 3, 10].map(n => drawnAt(n, tremble).stray);
  check('a tremor of 1.5px is all there at stability 0, somewhat less at 3, and less than a third of it at 10',
    shakes[0] > 1.4 && shakes[1] < shakes[0] * 0.85 && shakes[2] < shakes[1] * 0.5 && shakes[2] < shakes[0] / 3);
  ink.setStability(3);

  // --- the laser: a line to point with, that is never one of the strokes ---
  ink.load([{ tool: 'pen', color: '#000', size: 3, points: [[50, 50], [150, 50]] }]);
  changes = erases = 0;
  const [inkGroup, beamGroup] = svg.querySelectorAll(':scope > g');
  ink.setColor('#ff1744');
  ink.setTool('laser');
  fire('pointerdown', 60, 100, 'pen', 2, { pressure: 0.5 });
  fire('pointermove', 140, 110, 'pen', 2, { pressure: 0.5 });
  const beam = beamGroup.firstElementChild;
  check('the laser draws a glowing line while the stylus is down, apart from the strokes',
    beamGroup.children.length === 1 && beam.tagName === 'g' && beam.children.length === 5 && beam.children[3].getAttribute('stroke') === '#ff1744' &&
    beam.children[0].getAttribute('d').startsWith('M60 100') && inkGroup.children.length === 1);
  fire('pointerup', 140, 110, 'pen', 2, { buttons: 0 });
  check('lifting it adds no stroke, tells nobody, and leaves nothing to undo',
    ink.getStrokes().length === 1 && changes === 0 && !ink.canUndo() && !ink.canRedo());
  check('the line is still there, fading by itself', beam.isConnected && beam.getAnimations().length === 1);
  drag(60, 100, 140, 110, 'pen');
  check('each laser line fades on its own', beamGroup.children.length === 2 && beamGroup.children[1].getAnimations().length === 1);
  ink.setTool('eraser');
  drag(100, 90, 100, 120);   // straight across both laser lines
  check('the eraser does nothing to a laser line', beamGroup.children.length === 2 && ink.getStrokes().length === 1 && changes === 0 && erases === 0);
  ink.setTool('laser');
  drag(60, 120, 140, 120, 'touch');
  check('a finger does not draw with the laser either: it scrolls', beamGroup.children.length === 2);
  ink.load(ink.getStrokes());
  check('opening a note clears away any laser line still fading', beamGroup.children.length === 0 && inkGroup.children.length === 1);
  ink.setTool('pen');

  // --- hold the tip still at the end of a stroke: it becomes the shape it was meant to be ---
  // Each drawing gets a sheet and an engine of its own, so that all of them can be held at the same
  // time: one short real wait for the lot (the hold is half a second in the app, 20ms here).
  const wait = ms => new Promise(done => setTimeout(done, ms));
  const sheet = (tool, opacity = 1) => {
    const el = svg.cloneNode(false), s = { changes: 0 };
    el.removeAttribute('id');
    out.before(el);
    s.ink = createInk(el, { onChange: () => s.changes++ });
    s.ink.setTool(tool);
    s.ink.setOpacity(opacity);
    s.ink.setHold(20);
    s.fire = (type, [x, y], buttons = 1) => {
      const at = el.getBoundingClientRect();
      el.dispatchEvent(new PointerEvent(type, { pointerId: 2, pointerType: 'pen', button: 0, buttons, pressure: 0.6, bubbles: true, cancelable: true, clientX: at.left + x * 2, clientY: at.top + y * 2 }));
    };
    // A stylus stroke through the points, the stylus left down at its end.
    s.trace = pts => pts.forEach((pt, i) => s.fire(i ? 'pointermove' : 'pointerdown', pt));
    s.lift = pt => s.fire('pointerup', pt, 0);
    [s.strokes, s.beams] = el.querySelectorAll(':scope > g');
    s.last = () => s.ink.getStrokes().at(-1);
    return s;
  };
  const drawnLine = shaky(along([60, 60], [260, 120])), drawnCircle = shaky(oval(200, 150, 60));
  const drawnBox = shaky(along([100, 80], [300, 80], [300, 200], [100, 200], [100, 80])), drawnTriangle = shaky(along([200, 60], [300, 230], [100, 230], [200, 60]));
  const letter = shaky(none['the letter a (a loop and a tail)'], 1), scrawl = shaky(none['a scribble over itself'], 1);

  const quick = sheet('pen');
  quick.trace(drawnLine);
  quick.lift(drawnLine.at(-1));
  quick.trace(drawnCircle);
  quick.lift(drawnCircle.at(-1));
  const holds = {
    line: [sheet('pen'), drawnLine], circle: [sheet('glow', 0.5), drawnCircle], box: [sheet('flow'), drawnBox], triangle: [sheet('highlighter'), drawnTriangle],
    letter: [sheet('pen'), letter], scrawl: [sheet('pen'), scrawl], part: [sheet('pen'), drawnCircle.slice(0, 40)], laser: [sheet('laser'), drawnLine],
  };
  for (const [s, pts] of Object.values(holds)) s.trace(pts);
  await wait(40);   // every stylus has now been held still long enough
  check('a shaky line and a shaky circle that are lifted straight away are kept as drawn',
    quick.ink.getStrokes().length === 2 && quick.ink.getStrokes()[0].points.length > 20 && offEllipse(quick.last().points, 200, 150, 60, 60) > 1 && quick.changes === 2);

  const [liner] = holds.line;
  check('a shaky line held still at its end becomes a straight line there and then, before the stylus lifts',
    /^M[\d.]+ [\d.]+L[\d.]+ [\d.]+$/.test(liner.strokes.lastElementChild.getAttribute('d')) && liner.ink.getStrokes().length === 0 && liner.changes === 0);
  liner.fire('pointermove', [250, 160]);
  check('...whose far end then follows the stylus', liner.strokes.lastElementChild.getAttribute('d').endsWith('L250 160'));
  liner.fire('pointermove', [260, 62]);
  liner.lift([260, 62]);
  const straight = liner.last();
  check('lifted: a two-point stroke from where it began to where the stylus left, put level because it was within 3 degrees of it',
    straight.points.length === 2 && String(straight.points[0]) === String(quick.ink.getStrokes()[0].points[0]) && String(straight.points[1]) === `260,${straight.points[0][1]}` &&
    straight.tool === 'pen' && liner.changes === 1);
  liner.ink.undo();
  check('the straightened line is one step to undo', liner.ink.getStrokes().length === 0 && !liner.ink.canUndo());
  liner.ink.redo();
  liner.ink.setTool('eraser');
  liner.fire('pointerdown', [160, 40]); liner.fire('pointermove', [160, 80]); liner.lift([160, 80]);
  check('...and it is erased like any stroke', liner.ink.getStrokes().length === 0 && liner.strokes.children.length === 0);

  const [rounder] = holds.circle;
  rounder.fire('pointermove', [300, 250]);   // a closed shape does not follow the stylus afterwards
  rounder.lift([300, 250]);
  const circled = rounder.last(), circleBox = boxOf({ ...circled, size: 0 }), circleR = (circleBox[2] - circleBox[0]) / 2;
  check('a shaky circle held is stored as a circle, in the same pen: tool, colour, size and opacity',
    rounder.ink.getStrokes().length === 1 && offEllipse(circled.points, (circleBox[0] + circleBox[2]) / 2, (circleBox[1] + circleBox[3]) / 2, circleR, circleR) < 0.02 &&
    Math.abs(circleR - 60) < 3 && circled.tool === 'glow' && circled.color === '#000' && circled.size === 3 && circled.opacity === 0.5 &&
    rounder.strokes.lastElementChild.tagName === 'g' && rounder.strokes.lastElementChild.getAttribute('opacity') === '0.5');
  rounder.ink.load(rounder.ink.getStrokes());
  check('...and it survives save and load', String(rounder.last().points) === String(circled.points) && rounder.last().tool === 'glow' && rounder.last().opacity === 0.5);

  const [boxer] = holds.box;
  boxer.lift(drawnBox.at(-1));
  const boxed = boxer.last(), boxSides = sidesOf(boxed.points), boxEl = boxer.strokes.lastElementChild;
  // How thick the ink is at (x, y), measured across it along (dx, dy).
  const across = (x, y, dx, dy) => { let n = 0; for (let k = -8; k <= 8; k += 0.1) if (boxEl.isPointInFill(new DOMPoint(x + dx * k, y + dy * k))) n++; return n / 10; };
  check('a shaky rectangle held with the flow pen is a rectangle of four straight sides and square corners',
    boxed.tool === 'flow' && boxSides.length === 4 && turnsBy(boxSides, Math.PI / 2) && closed(boxed.points));
  check('...evenly wide: the same pressure on every point, and as thick across each side as the pen\'s size',
    boxed.points.every(p => p[2] === 0.5) && [across(200, boxed.points[0][1], 0, 1), across(150, boxed.points[0][1], 0, 1), across(boxed.points[0][0], 140, 1, 0)].every(w => Math.abs(w - 3) < 0.4));

  const [pointer] = holds.triangle;
  pointer.lift(drawnTriangle.at(-1));
  check('a shaky triangle held with the highlighter is a triangle of three straight sides',
    pointer.last().tool === 'highlighter' && sidesOf(pointer.last().points).length === 3 && closed(pointer.last().points));

  holds.letter[0].lift(letter.at(-1));
  holds.scrawl[0].lift(scrawl.at(-1));
  check('a letter or a scribble that is held stays exactly as drawn',
    [holds.letter[0], holds.scrawl[0]].every(s => s.ink.getStrokes().length === 1 && s.last().points.length > 40 && sidesOf(s.last().points).length > 8));

  const [beamer] = holds.laser;
  check('the laser is never made into a shape', beamer.beams.lastElementChild.firstElementChild.getAttribute('d').includes('Q'));
  beamer.lift(drawnLine.at(-1));

  // Held part of the way round: no shape yet, so nothing changes, and the hold at the end can still find one.
  const [later] = holds.part;
  const partWay = later.strokes.lastElementChild.getAttribute('d');
  drawnCircle.slice(40).forEach(pt => later.fire('pointermove', pt));
  await wait(40);
  later.lift(drawnCircle.at(-1));
  check('a hold in the middle of a drawing that is no shape yet changes nothing; the hold at its end still makes the shape',
    partWay.includes('Q') && later.ink.getStrokes().length === 1 && offEllipse(later.last().points, 200, 150, 60, 60) < 3 && closed(later.last().points));
  document.querySelectorAll('svg:not(#s)').forEach(el => el.remove());

} catch (err) {
  failed++;
  line(`ERROR  ${err && err.stack || err}`, false);
}

line(`${failed ? 'FAILED' : 'ALL PASSED'}: ${passed} passed, ${failed} failed`, !failed);
</script>
