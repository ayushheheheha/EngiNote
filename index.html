<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <!-- "Add to Home Screen" on iPad / Android opens the app with no browser bars at all. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="EngiNote">
  <title>EngiNote</title>
  <!-- The Engikode icon, black on white. PNG for Safari (tab and home screen), SVG where it is supported. -->
  <link rel="icon" href="apple-touch-icon.png" type="image/png" sizes="180x180">
  <link rel="icon" href="icon.svg" type="image/svg+xml" sizes="any">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script>
    // Set the theme before first paint (no flash): the saved choice, else what the device prefers.
    let saved;
    try { saved = localStorage.getItem('theme'); } catch { /* storage blocked */ }
    document.documentElement.dataset.theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  </script>
</head>
<body>

  <!-- Library (home): a sidebar (where notes live) beside the notes themselves. -->
  <div id="library">
    <aside id="side" aria-label="Library">
      <div class="side-top">
        <!-- The Engikode icon: the designer's shapes unchanged, coloured by the theme (black on light, white on dark). -->
        <svg class="mark" viewBox="0 0 457.26 304.89" aria-hidden="true"><polygon points="457.26 0 378.29 0 197.77 243.9 197.78 304.89 430.53 304.88 330.01 182.91 457.26 0"/><polygon points="197.77 182.93 197.77 121.95 197.77 121.95 0 121.95 0 121.95 0 182.93 0 182.93 197.77 182.93"/><rect y="243.9" width="263.68" height="60.99" rx="0" ry="0"/><polygon points="197.77 60.98 197.77 0 197.77 0 0 0 0 0 0 60.98 0 60.98 197.77 60.98"/></svg>
        <span class="side-brand">EngiNote</span>
        <button class="icon-btn theme-btn" type="button" title="Light / dark" aria-label="Switch between light and dark">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
        </button>
        <button id="side-hide" class="icon-btn" type="button" title="Hide the sidebar" aria-label="Hide the sidebar">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
        </button>
      </div>
      <nav class="side-nav">
        <button id="side-all" class="side-item" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/></svg>
          <span>Unfiled</span><b class="side-count"></b>
        </button>
        <button id="side-videos" class="side-item" type="button" hidden>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10.5l5-3v9l-5-3z"/></svg>
          <span>Recordings</span><b class="side-count"></b>
        </button>
        <div class="side-head">
          <span>Folders</span>
          <button id="side-new-folder" class="icon-btn" type="button" title="New folder" aria-label="New folder">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 10v5M9.5 12.5h5"/></svg>
          </button>
        </div>
        <div id="side-folders"></div>
      </nav>
      <div class="side-foot">
        <!-- Backup: one button, and a small menu to save everything to a file or load it back. -->
        <div id="backup-wrap" class="tool-wrap">
          <button id="backup-btn" class="side-item" type="button" aria-haspopup="true" aria-expanded="false">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>
            <span>Backup</span>
          </button>
          <div class="flyout menu">
            <button id="backup-save" class="btn-secondary" type="button">Save a backup file</button>
            <button id="backup-load" class="btn-secondary" type="button">Restore from a file</button>
          </div>
        </div>
      </div>
    </aside>

    <div id="lib-main">
      <header class="lib-bar">
        <button id="side-show" class="icon-btn" type="button" title="Show the sidebar" aria-label="Show the sidebar">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
        </button>
        <!-- The title: where the library is looking. In a folder it is the folder's name (type to rename), with a way back and a way to delete the folder. -->
        <div id="folder-bar">
          <button id="folder-back" class="icon-btn" type="button" title="Back to all notes" aria-label="Back to all notes">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <input id="folder-name" type="text" title="Rename folder" aria-label="Folder name" autocomplete="off" spellcheck="false">
          <button id="folder-delete" class="icon-btn" type="button" title="Delete this folder" aria-label="Delete this folder">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
          </button>
        </div>
        <div class="lib-actions">
          <!-- Find a note by its name. -->
          <div id="lib-find">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
            <input id="search" type="search" placeholder="Search" aria-label="Search notes by name" autocomplete="off" spellcheck="false" enterkeyhint="search">
            <button id="search-clear" class="icon-btn" type="button" title="Clear the search" aria-label="Clear the search">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>
            </button>
          </div>
          <!-- Make something: a notebook, an import, a folder. -->
          <div id="add-note-wrap" class="tool-wrap">
            <button id="add-note" class="icon-btn" type="button" title="New" aria-label="New" aria-haspopup="true" aria-expanded="false">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <div class="flyout menu">
              <button id="new-notebook" class="btn-secondary" type="button">New notebook</button>
              <button id="import-btn" class="btn-secondary" type="button">Import HTML or PDF</button>
              <button id="new-folder" class="btn-secondary" type="button">New folder</button>
            </div>
          </div>
        </div>
      </header>
      <!-- Which notes to show, and in what order. -->
      <div class="lib-tabs">
        <div id="tabs" role="group" aria-label="Show">
          <button type="button" data-tab="all" aria-pressed="true">All</button>
          <button type="button" data-tab="notebook" aria-pressed="false">Notebooks</button>
          <button type="button" data-tab="import" aria-pressed="false">Imported</button>
        </div>
        <label id="sort-wrap">
          <select id="sort" title="Order of the notes" aria-label="Order of the notes">
            <option value="edited">Last edited</option>
            <option value="name">Name</option>
          </select>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 10l4 4 4-4"/></svg>
        </label>
      </div>
      <main>
        <div id="grid">
          <button id="import-tile" type="button" title="New notebook">
            <span class="create-plus"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
            <span class="create-label">Create</span>
          </button>
        </div>
        <p id="empty" hidden>No notes yet. Tap Create to start a notebook, or import an HTML or PDF file with the + at the top.</p>
      </main>
    </div>
    <input id="file-input" type="file" accept=".html,.htm,text/html,.pdf,application/pdf" multiple hidden>
    <input id="backup-input" type="file" accept=".json,application/json" hidden>
  </div>

  <!-- New notebook: a blank note made of pages. notebook.js fills it in and reads it; a paper is described in pages.js.
       Each group of choices names the part of the paper it sets (data-key), each choice its value. -->
  <dialog id="notebook" aria-labelledby="nb-heading">
    <form method="dialog">
      <h2 id="nb-heading">New notebook</h2>
      <div class="nb-body">
        <!-- A picture of the page as it will be made. -->
        <div class="nb-picture" aria-hidden="true"><div id="nb-sheet"><div id="nb-page"></div></div></div>
        <div class="nb-options">
          <label class="nb-row">Title
            <input id="nb-title" type="text" placeholder="Untitled notebook" maxlength="120" autocomplete="off" spellcheck="false">
          </label>
          <div class="nb-row">Direction
            <div class="nb-choice" data-key="direction" role="group" aria-label="Direction">
              <button class="icon-btn chip" type="button" data-value="vertical">Vertical</button>
              <button class="icon-btn chip" type="button" data-value="horizontal">Horizontal</button>
            </div>
          </div>
          <div class="nb-row">Size
            <div class="nb-choice" data-key="size" role="group" aria-label="Size">
              <button class="icon-btn chip" type="button" data-value="A4">A4</button>
              <button class="icon-btn chip" type="button" data-value="Letter">Letter</button>
              <button class="icon-btn chip" type="button" data-value="16:9">16:9</button>
              <button class="icon-btn chip" type="button" data-value="4:3">4:3</button>
            </div>
          </div>
          <div class="nb-row">Template
            <div class="nb-choice" data-key="template" role="group" aria-label="Template">
              <button class="nb-tile" type="button" data-value="plain"><span></span>Plain</button>
              <button class="nb-tile" type="button" data-value="rule"><span></span>Rule</button>
              <button class="nb-tile" type="button" data-value="grid"><span></span>Grid</button>
              <button class="nb-tile" type="button" data-value="dot"><span></span>Dot</button>
              <button class="nb-tile" type="button" data-value="cornell"><span></span>Cornell</button>
              <button class="nb-tile" type="button" data-value="planner"><span></span>Planner</button>
            </div>
          </div>
          <div class="nb-row">Paper
            <div class="nb-choice" data-key="color" role="group" aria-label="Paper colour">
              <button class="icon-btn swatch" type="button" data-value="#ffffff" style="--c:#ffffff" title="White" aria-label="White"></button>
              <button class="icon-btn swatch" type="button" data-value="#fbf2d8" style="--c:#fbf2d8" title="Cream" aria-label="Cream"></button>
              <button class="icon-btn swatch" type="button" data-value="#111111" style="--c:#111111" title="Black" aria-label="Black"></button>
              <label class="icon-btn swatch custom" title="Another colour"><input id="nb-color" type="color" aria-label="Another paper colour"></label>
            </div>
          </div>
          <div class="nb-row">Lines
            <div class="nb-choice" data-key="line" role="group" aria-label="Line colour">
              <button class="icon-btn swatch" type="button" data-value="#c8ccd6" style="--c:#c8ccd6" title="Grey" aria-label="Grey"></button>
              <button class="icon-btn swatch" type="button" data-value="#a8c8f0" style="--c:#a8c8f0" title="Light blue" aria-label="Light blue"></button>
              <button class="icon-btn swatch" type="button" data-value="#e89a9a" style="--c:#e89a9a" title="Red" aria-label="Red"></button>
              <label class="icon-btn swatch custom" title="Another colour"><input id="nb-line" type="color" aria-label="Another line colour"></label>
            </div>
          </div>
          <label class="nb-row">Spacing
            <input id="nb-spacing" type="range" min="1" max="8" step="0.5">
          </label>
        </div>
      </div>
      <div class="nb-actions">
        <button id="nb-cancel" class="btn-secondary" type="button">Cancel</button>
        <!-- autofocus: else the title takes the focus as the dialog opens, and a tablet's keyboard comes up over it -->
        <button id="nb-create" class="btn-primary" value="create" autofocus>Create</button>
      </div>
    </form>
  </dialog>

  <!-- A file being imported: its own name to keep with one tap, or another to type. -->
  <dialog id="rename" aria-labelledby="rn-heading">
    <form method="dialog">
      <h2 id="rn-heading">Name this note</h2>
      <input id="rn-name" type="text" aria-label="Name" maxlength="120" autocomplete="off" spellcheck="false">
      <!-- Where it goes: Unfiled, or one of the folders. The device's own picker opens. -->
      <label id="rn-where">Save in
        <select id="rn-folder" aria-label="Save in"></select>
      </label>
      <div class="nb-actions">
        <button id="rn-skip" class="btn-secondary" type="button">Skip</button>
        <!-- autofocus: else the name takes the focus as the dialog opens, and a tablet's keyboard comes up over it -->
        <button class="btn-primary" value="ok" autofocus>Import</button>
      </div>
    </form>
  </dialog>

  <!-- Editor -->
  <div id="editor">
    <div id="toolbar">
      <div class="strip">
        <button id="back-btn" class="icon-btn" type="button" title="Back to library" aria-label="Back to library">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <input id="note-name" type="text" title="Rename note" aria-label="Note name" autocomplete="off" spellcheck="false">
      </div>

      <div class="strip">
        <!-- The pens: one button each, made by app.js from the saved list. Tapping the pen in use opens its settings (#pen-panel). -->
        <div id="pens" class="group" role="group" aria-label="Pens"></div>
        <div id="add-wrap" class="tool-wrap">
          <button id="add-pen" class="icon-btn" type="button" title="Add a pen" aria-label="Add a pen" aria-haspopup="true" aria-expanded="false">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <div class="flyout menu">
            <button class="btn-secondary" type="button" data-add="pen">Pen</button>
            <button class="btn-secondary" type="button" data-add="flow">Flow pen</button>
            <button class="btn-secondary" type="button" data-add="glow">Glow pen</button>
            <button class="btn-secondary" type="button" data-add="highlighter">Highlighter</button>
            <button class="btn-secondary" type="button" data-add="laser">Laser</button>
          </div>
        </div>
        <span class="sep"></span>
        <div class="group" role="group" aria-label="Tools">
          <!-- The eraser and its size slider, which flies out when the eraser is tapped while already selected. -->
          <div id="eraser-wrap" class="tool-wrap">
            <button class="icon-btn" type="button" data-tool="eraser" title="Eraser (E). Tap again to set its size" aria-label="Eraser" aria-haspopup="true" aria-expanded="false">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 19l-4-4 9-10 7 7-7 7H8z"/><path d="M8.5 10l7 6.5"/><path d="M13 19h7"/></svg>
            </button>
            <div class="flyout">
              <span class="dot-box"><span id="eraser-dot"></span></span>
              <input id="eraser-range" type="range" min="4" max="40" step="1" value="8" aria-label="Eraser size">
            </div>
          </div>
          <button id="auto-erase" class="icon-btn chip" type="button" aria-pressed="false" hidden
            title="Auto-deselect: go back to the previous tool after erasing" aria-label="Auto-deselect the eraser after use">Auto</button>
          <button class="icon-btn" type="button" data-tool="hand" title="Hand (V)" aria-label="Hand">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-4 0"/><path d="M14 10V4a2 2 0 0 0-4 0v2"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>
          </button>
          <!-- Text (T): tap the page to type. Tapped again, a flyout sets the size of the letters. -->
          <div id="text-wrap" class="tool-wrap">
            <button class="icon-btn" type="button" data-tool="text" title="Text (T): tap the page and type. Tap again to set its size" aria-label="Text" aria-haspopup="true" aria-expanded="false">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7V4.5h14V7M12 4.5V20M9 20h6"/></svg>
            </button>
            <div class="flyout">
              <span id="text-sample" aria-hidden="true">Aa</span>
              <input id="text-range" type="range" min="16" max="96" step="2" value="28" aria-label="Text size">
            </div>
          </div>
          <button id="image-btn" class="icon-btn" type="button" title="Add a picture from Photos or Files" aria-label="Add a picture">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg>
          </button>
          <button class="icon-btn" type="button" data-tool="lasso" title="Lasso (L): circle some ink to move, resize, recolour or delete it" aria-label="Lasso">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 22a5 5 0 0 1-2-4"/><path d="M3.3 14A6.8 6.8 0 0 1 2 10c0-4.4 4.5-8 10-8s10 3.6 10 8-4.5 8-10 8a12 12 0 0 1-5-1"/><circle cx="5" cy="16" r="2"/></svg>
          </button>
          <button id="finger-btn" class="icon-btn chip" type="button" aria-pressed="false"
            title="Draw with a finger. Off: fingers scroll and zoom, only a stylus or mouse draws" aria-label="Draw with a finger">F</button>
        </div>
        <span class="sep"></span>
        <div class="group" role="group" aria-label="History">
          <button id="undo-btn" class="icon-btn" type="button" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
          </button>
          <button id="redo-btn" class="icon-btn" type="button" title="Redo (Ctrl+Shift+Z)" aria-label="Redo" disabled>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>
          </button>
        </div>
        <span class="sep"></span>
        <div class="group" role="group" aria-label="View">
          <button id="full-btn" class="icon-btn" type="button" title="Full screen (F)" aria-label="Full screen" aria-pressed="false">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          </button>
          <button id="wide-btn" class="icon-btn chip" type="button" aria-pressed="false"
            title="Show the app in a 16:9 window" aria-label="16 by 9 window">16:9</button>
          <!-- Add space (space.js): marks where a blank page or a gap can be put into the note, and puts it there. -->
          <button id="space-btn" class="icon-btn" type="button" aria-pressed="false"
            title="Add space: a blank page, or a gap in the note, with the ink below moving down" aria-label="Add space">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16M4 20h16M12 8v8M8 12h8"/></svg>
          </button>
          <!-- Promo cover (cover.js): a title page for EngiKode (channel, website, courses) in front of the note. On for new imports until it is switched off. -->
          <button id="promo-btn" class="icon-btn" type="button" aria-pressed="true"
            title="Promo cover: a title page with the channel, website and courses, in front of this note (on for new imports)" aria-label="Promo cover">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 15h5M7 11h10"/></svg>
          </button>
          <!-- Pages (thumbs.js): a column of small pictures of the pages of a notebook or a PDF, to jump between them, move them and change them. -->
          <button id="pages-btn" class="icon-btn" type="button" aria-pressed="false" hidden
            title="Pages: see them all, jump to one, move, copy or delete them" aria-label="Pages">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3" width="12" height="14" rx="2"/><path d="M5 7v11a3 3 0 0 0 3 3h9"/></svg>
          </button>
          <!-- Export (export.js): the note with its ink, as a PDF. -->
          <button id="export-btn" class="icon-btn" type="button" title="Export the note, with its ink, as a PDF" aria-label="Export as PDF">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>
          </button>
          <!-- Settings: the pen's shadow, and what the Apple Pencil's double-tap and squeeze do. -->
          <div id="settings-wrap" class="tool-wrap">
            <button id="settings-btn" class="icon-btn" type="button" title="Settings: the pen's shadow and the Apple Pencil's shortcuts" aria-label="Settings" aria-haspopup="true" aria-expanded="false">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></svg>
            </button>
            <div class="flyout settings">
              <div class="set-row"><span>Pen shadow</span><button id="ghost-btn" class="icon-btn chip" type="button" aria-pressed="true" title="Show a faint shadow of the Apple Pencil while it hovers over the page">On</button></div>
              <label class="set-row"><span>Pencil double-tap</span><select id="pencil-tap" aria-label="Apple Pencil double-tap"></select></label>
              <label class="set-row"><span>Pencil squeeze</span><select id="pencil-squeeze" aria-label="Apple Pencil squeeze"></select></label>
            </div>
          </div>
          <button class="icon-btn fit-btn rail-only" type="button" title="Fit width" aria-label="Fit width">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v16M20 4v16M8 12h8M8 12l3-3M8 12l3 3M16 12l-3-3M16 12l-3 3"/></svg>
          </button>
        </div>
      </div>

      <div class="strip" role="group" aria-label="Zoom">
        <button id="zoom-out" class="icon-btn" type="button" title="Zoom out" aria-label="Zoom out">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
        </button>
        <button id="zoom-label" type="button" title="Reset zoom to 100%" aria-label="Reset zoom to 100%">100%</button>
        <button id="zoom-in" class="icon-btn" type="button" title="Zoom in" aria-label="Zoom in">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg>
        </button>
        <button id="zoom-fit" class="icon-btn fit-btn" type="button" title="Fit width" aria-label="Fit width">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v16M20 4v16M8 12h8M8 12l3-3M8 12l3 3M16 12l-3-3M16 12l-3 3"/></svg>
        </button>
        <button class="icon-btn theme-btn" type="button" title="Light / dark" aria-label="Switch between light and dark">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
        </button>
      </div>

      <!-- The small arrow at the toolbar's edge: it puts the tools away, and brings them back (body.tools-off in style.css). -->
      <button id="tools-toggle" type="button" aria-pressed="false">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
      </button>
    </div>

    <!-- The window onto the note. It does not scroll: app.js moves #mover inside it and scales #page (see "the view" there). -->
    <div id="scroller">
      <div id="mover">
        <div id="page">
          <!-- No allow-scripts: imported files are untrusted. scrolling="no" keeps a scrollbar from narrowing the layout. -->
          <iframe id="frame" sandbox="allow-same-origin" scrolling="no" tabindex="-1" title="Imported document"></iframe>
          <!-- Text boxes and pictures (items.js): over the paper, under the ink. -->
          <div id="items"></div>
          <svg id="ink"></svg>
        </div>
      </div>
      <div id="scrollbar" hidden></div>
    </div>

    <!-- The pages of the open notebook or PDF (thumbs.js). It floats over the note's left edge. -->
    <aside id="pages-panel" aria-label="Pages" hidden>
      <div id="pages-list" role="list"></div>
    </aside>
    <div id="page-menu" role="menu" hidden></div>
    <!-- Where the toolbar's flyouts (eraser size, text size, new pen, settings) are shown: the strip they
         hang from slides sideways, and would cut them off. app.js moves them here and places them (flyout). -->
    <div id="flyouts"></div>

    <!-- What can be done with the ink the lasso holds: a new colour, or the bin. app.js puts the pen
         panel's colours in before the bin; lasso.js keeps the bar by the selection. -->
    <div id="lasso-bar" class="strip" role="group" aria-label="Selected ink" hidden>
      <button id="lasso-delete" class="icon-btn" type="button" title="Delete the selected ink" aria-label="Delete the selected ink">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
      </button>
    </div>

    <!-- The settings of the pen in use. app.js fills it in and places it beside that pen's button. -->
    <div id="pen-panel" role="dialog" aria-label="Pen settings" hidden>
      <div class="panel-head">
        <strong id="pen-type"></strong>
        <button id="pen-remove" class="icon-btn" type="button" title="Remove this pen" aria-label="Remove this pen">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
        </button>
      </div>
      <label class="panel-row">Thickness <output id="pen-size-out"></output>
        <input id="pen-size" type="range" min="1" max="12" step="0.5">
      </label>
      <label class="panel-row">Opacity <output id="pen-opacity-out"></output>
        <input id="pen-opacity" type="range" min="10" max="100" step="5">
      </label>
      <!-- How much the pen steadies the hand: its ink trails the tip by this much. 0: not at all. -->
      <label class="panel-row" title="Steadies the line: higher is smoother and trails the tip more">Stability <output id="pen-stability-out"></output>
        <input id="pen-stability" type="range" min="0" max="10" step="1">
      </label>
      <div id="pen-colors" role="group" aria-label="Colour">
        <button class="icon-btn swatch" type="button" data-color="#111111" style="--c:#111111" title="Black" aria-label="Black"></button>
        <button class="icon-btn swatch" type="button" data-color="#ffffff" style="--c:#ffffff" title="White" aria-label="White"></button>
        <button class="icon-btn swatch" type="button" data-color="#e03131" style="--c:#e03131" title="Red" aria-label="Red"></button>
        <button class="icon-btn swatch" type="button" data-color="#ff1744" style="--c:#ff1744" title="Bright red" aria-label="Bright red"></button>
        <button class="icon-btn swatch" type="button" data-color="#1c7ed6" style="--c:#1c7ed6" title="Blue" aria-label="Blue"></button>
        <button class="icon-btn swatch" type="button" data-color="#2f9e44" style="--c:#2f9e44" title="Green" aria-label="Green"></button>
        <button class="icon-btn swatch" type="button" data-color="#f08c00" style="--c:#f08c00" title="Orange" aria-label="Orange"></button>
        <button class="icon-btn swatch" type="button" data-color="#ffea00" style="--c:#ffea00" title="Bright yellow" aria-label="Bright yellow"></button>
        <button class="icon-btn swatch" type="button" data-color="#7048e8" style="--c:#7048e8" title="Purple" aria-label="Purple"></button>
        <!-- Any other colour: the device's own colour picker, behind the rainbow button. -->
        <label class="icon-btn swatch custom" title="Another colour"><input id="pen-custom" type="color" aria-label="Another colour"></label>
      </div>
    </div>
  </div>

  <!-- Screen recording: only in the iPad app (the page cannot record by itself). With the 16:9 window on,
       the video is that window and the bar sits in the black band under it, never in the picture.
       Without it the video is the whole screen, bar included. -->
  <div id="rec-bar" class="strip" role="group" aria-label="Screen recording">
    <!-- First comes what is left when the bar is put away in the corner: this button (then a red dot)
         and, while recording, the clock. The bar opens out of them, and closes back to them. -->
    <button id="rec-min" class="icon-btn" type="button" aria-pressed="false" aria-label="Put the recording bar away">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 7l-5 5 5 5"/></svg><span class="rec-dot"></span>
    </button>
    <output id="rec-time" aria-label="Recorded so far">0:00:00</output>
    <button id="rec-btn" class="icon-btn chip" type="button" aria-pressed="false" title="Record a video: the 16:9 window if it is on, else the whole screen"><span class="rec-dot"></span><span id="rec-label">Record</span></button>
    <button id="rec-pause" class="icon-btn chip" type="button" aria-pressed="false" title="Pause: nothing is recorded until you resume">Pause</button>
    <button id="rec-count-btn" class="icon-btn chip" type="button" aria-pressed="true" title="Count down 3, 2, 1 before a recording starts" aria-label="Count down before recording">3s</button>
    <button id="rec-mic" class="icon-btn chip" type="button" aria-pressed="true" title="Record your voice with the screen" aria-label="Record the microphone">Mic</button>
    <button id="rec-enhance" class="icon-btn chip" type="button" aria-pressed="false" title="Enhance voice: take the background noise out of your voice" aria-label="Enhance voice">Enhance</button>
    <!-- Mic check: switched on, the little picture beside it moves with what the microphone hears
         (as it would be recorded: through Enhance, if that is on). It stays through a recording. -->
    <button id="rec-check" class="icon-btn" type="button" aria-pressed="false" title="Mic check: show the sound the microphone is picking up" aria-label="Mic check">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 10v4"/></svg>
    </button>
    <canvas id="rec-waves" width="116" height="56" aria-hidden="true"></canvas>
    <!-- The camera bubble: the front camera's picture, floating over the app (the app draws it, not
         the page: ios/App/CameraBubble.swift). The second button, there while the bubble is, changes its shape. -->
    <button id="rec-cam" class="icon-btn" type="button" aria-pressed="false" title="Camera bubble: show yourself in a corner. Drag it to move it, pinch to resize" aria-label="Camera bubble">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10.5l5-3v9l-5-3z"/></svg>
    </button>
    <button id="rec-shape" class="icon-btn" type="button" data-shape="circle" title="Change the shape of the camera bubble" aria-label="Change the shape of the camera bubble"><span></span></button>
    <!-- The values are the names Recorder.swift knows. Sizes are what an hour comes to at most. -->
    <select id="rec-quality" title="Video quality, and the most an hour of it takes up" aria-label="Video quality">
      <option value="high">High 1080p 60 · 6.3 GB/h</option>
      <option value="standard" selected>Standard 1080p 60 · 3.2 GB/h</option>
      <option value="small">Small 720p 60 · 1.4 GB/h</option>
    </select>
  </div>

  <!-- The countdown before a recording: app.js lays it over the note's window and puts 3, 2, 1 in it. -->
  <div id="rec-count" role="status" aria-label="Recording starts in" hidden></div>

  <input id="image-input" type="file" accept="image/*" hidden>
  <!-- A long press with a finger on the page: paste the picture that was copied, there (app.js). -->
  <button id="paste-pill" class="btn-secondary" type="button" hidden>Paste picture</button>
  <p id="message" role="status" hidden></p>

  <!-- What the pens in the tray are painted with (app.js, penPicture): a dark barrel, bright metal,
       and a shade laid over coloured parts to make them round. Each runs across the pen. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="pen-barrel"><stop offset="0" stop-color="#1b1d23"/><stop offset=".28" stop-color="#565c6b"/><stop offset=".42" stop-color="#7d8496"/><stop offset=".62" stop-color="#454a57"/><stop offset="1" stop-color="#15171c"/></linearGradient>
      <linearGradient id="pen-metal"><stop offset="0" stop-color="#7f8594"/><stop offset=".3" stop-color="#f4f6fa"/><stop offset=".5" stop-color="#cfd3dc"/><stop offset=".78" stop-color="#9299a8"/><stop offset="1" stop-color="#666c7a"/></linearGradient>
      <linearGradient id="pen-shade"><stop offset="0" stop-color="#000" stop-opacity=".22"/><stop offset=".3" stop-color="#fff" stop-opacity=".42"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".34"/></linearGradient>
    </defs>
  </svg>

  <template id="card-template">
    <div class="card">
      <button class="card-open" type="button">
        <span class="card-thumb"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/></svg></span>
        <span class="card-name"></span>
        <span class="card-date"></span>
      </button>
      <!-- Over the picture's corner: one button that opens the card's three (duplicate, move, delete). -->
      <button class="icon-btn card-more" type="button" title="More" aria-label="More" aria-expanded="false">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>
      </button>
      <div class="card-actions">
        <button class="icon-btn card-copy" type="button" title="Duplicate note" aria-label="Duplicate note">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/></svg>
        </button>
        <!-- The select is invisible and covers the icon: tapping it opens the device's own picker. -->
        <label class="icon-btn card-move" title="Move to a folder">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9.5 13h5M12.5 11l2 2-2 2"/></svg>
          <select aria-label="Move to a folder"></select>
        </label>
        <button class="icon-btn card-delete" type="button" title="Delete note" aria-label="Delete note">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
        </button>
      </div>
    </div>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
